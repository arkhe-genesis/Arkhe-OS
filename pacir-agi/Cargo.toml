[workspace]
resolver = "2"
members = [
  "crates/pacir-agi-core",
  "crates/pacir-agi-verify",
  "crates/pacir-agi-serve",
  "crates/pacir-agi-kani",
  "crates/pacir-agi-cli",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.36", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
