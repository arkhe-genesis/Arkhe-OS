[workspace]
resolver = "2"
members = [
    "pacir-q-core",
    "pacir-q-benchmarking",
    "pacir-q-kani",
    "pacir-q-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pacir-org/pacir-q"

[workspace.dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
